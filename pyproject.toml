[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "도메인 독립 검색·RAG 평가 하네스: 랭킹 지표, 신뢰구간·대응 검정, 실험 매트릭스, 골든셋 비교"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "박성윤" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "httpx>=0.27"]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
