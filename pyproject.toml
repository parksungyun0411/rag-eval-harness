[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "도메인 독립 검색·RAG 평가 하네스: 랭킹 지표, 신뢰구간·대응 검정, 실험 매트릭스, 순위 안정성, 골든셋 비교, 교체 가능한 검색 구성 요소"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "박성윤" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "httpx>=0.27"]
kiwi = ["kiwipiepy>=0.18"]
models = ["sentence-transformers>=3.0", "torch>=2.3"]
opensearch = ["opensearch-py>=2.4"]
demo = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# 보고서 본문·데이터 출처 주석의 한국어 문장 길이
"src/rag_eval/leaderboard_experiment.py" = ["E501"]
"src/rag_eval/datasets/allganize_ko.py" = ["E501"]
